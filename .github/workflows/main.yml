name: "Dopamine: build and upload"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1 *'
    - cron: '0 0 1 4 *'
    - cron: '0 0 30 6 *'
    - cron: '0 0 28 9 *'
    - cron: '0 0 27 12 *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@main
        with:
            submodules: false

      - name: Install ldid
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Prepare BaseBin headers (.include)
        run: |
          set -x
          rm -rf BaseBin/.include
          mkdir -p BaseBin/.include
          cp -r BaseBin/_external/include/* BaseBin/.include/
          # SDK iOS 17.4+ already ships XPC: drop the vendored copy
          # (same as BaseBin/Makefile .include target) to avoid
          # "Redefinition of module 'XPC'"
          rm -rf BaseBin/.include/xpc

      - name: Build
        run: |
          set -x
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1

      - name: Upload Artifact
        id: dopamine-latest-upload
        uses: actions/upload-artifact@main
        with:
          name: Dopamine
          path: |
            ${{ github.workspace }}/Application/Dopamine.ipa